<!DOCTYPE html>
<html lang="kk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корей Тілі - Сөздік Жаттау (EPS-TOPIK)</title>
    <meta name="description"
        content="Корей тілін жаттауға арналған заманауи және ыңғайлы құрал. Емтиханға дайындық сөздері мен мысалдар.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;600;700;800&family=Outfit:wght@300;400;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="app-header">
        <div class="header-top">
            <div class="stats-badge" id="stats-badge">
                <span class="stats-icon">🏆</span>
                <span id="stats-text">0 / 0 жатталды</span>
            </div>
            <button id="theme-toggle" class="theme-toggle" title="Түнгі режим">
                <svg class="sun-icon" width="20" height="м20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </button>
        </div>

        <h1>🇰🇷 Корей Тілі</h1>
        <p>Емтиханға дайындық: Сөздік Жаттау</p>

        <div class="controls-row">
            <div class="search-container">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="search-input" placeholder="Сөзді немесе мысалды іздеу...">
            </div>
            <button id="shuffle-btn" class="secondary-btn" title="Араластыру">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="16 3 21 3 21 8"></polyline>
                    <line x1="4" y1="20" x2="21" y2="3"></line>
                    <polyline points="21 16 21 21 16 21"></polyline>
                    <line x1="15" y1="15" x2="21" y2="21"></line>
                    <line x1="4" y1="4" x2="9" y2="9"></line>
                </svg>
            </button>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">Барлығы</button>
            <button class="filter-btn" data-filter="not-learned">Жатталмаған</button>
            <button class="filter-btn" data-filter="learned">Жатталды</button>
        </div>
    </div>

    <div class="words-container" id="words-container">
        <!-- Word cards will be injected here -->
    </div>

    <button id="back-to-top" class="back-to-top" title="Жоғарыға">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 15l-6-6-6 6" />
        </svg>
    </button>

    <script src="script.js"></script>
</body>

</html>
